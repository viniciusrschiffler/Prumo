[package]
name = "prumo"
version = "0.1.0"
description = "Aplicativo local de organização de projetos"
authors = ["Vinicius Schiffler"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "prumo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-fs = "2.5.2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-persisted-scope = "2.3.8"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
